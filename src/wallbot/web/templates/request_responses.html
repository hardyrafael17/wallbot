<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request/Responses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-size: 0.75rem;
        }
        .sortable {
            cursor: pointer;
        }
        .sortable::after {
            content: ' \2195'; /* up-down arrow */
            opacity: 0.3;
        }
        .sortable.asc::after {
            content: ' \25B2'; /* up arrow */
            opacity: 1;
        }
        .sortable.desc::after {
            content: ' \25BC'; /* down arrow */
            opacity: 1;
        }
        .clickable-row {
            cursor: pointer;
        }
        .modal-body {
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Wallbot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/searches">Manage Searches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manual-search">Manual Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/saved_searches">Saved Searches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/saved_items_list">Saved Items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/requests">Request/Responses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="fetch('/restart', { method: 'POST' })">Restart</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Request/Responses</h1>
        <div class="mb-3 d-flex justify-content-between">
            <input type="text" id="urlFilter" class="form-control me-2" placeholder="Filter by URL...">
            <button id="deleteAllButton" class="btn btn-danger">Delete All</button>
        </div>
        <table class="table table-striped table-hover" id="requests-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th class="sortable" data-sort="url">URL</th>
                    <th>Method</th>
                    <th>Status</th>
                    <th class="sortable" data-sort="timestamp">Timestamp</th>
                </tr>
            </thead>
            <tbody>
                {% for req in requests %}
                <tr class="clickable-row">
                    <td>{{ req.id }}</td>
                    <td>{{ req.url }}</td>
                    <td>{{ req.method }}</td>
                    <td>{{ req.status }}</td>
                    <td>{{ req.timestamp }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- JSON Details Modal -->
    <div class="modal fade" id="jsonDetailsModal" tabindex="-1" aria-labelledby="jsonDetailsModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="jsonDetailsModalLabel">JSON Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="json-details-content"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="copyJsonButton">Copy JSON</button>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/caldwell/renderjson@1.4.0/renderjson.js"></script>
        <script>
            const requests_data = {{ requests | tojson }};
            console.log(requests_data);
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const table = document.getElementById('requests-table');
                const headers = table.querySelectorAll('th.sortable');
                const tbody = table.querySelector('tbody');
                        let rows = Array.from(tbody.querySelectorAll('tr'));
                const urlFilterInput = document.getElementById('urlFilter');
                const deleteAllButton = document.getElementById('deleteAllButton');
                const jsonDetailsModal = new bootstrap.Modal(document.getElementById('jsonDetailsModal'));
                const copyJsonButton = document.getElementById('copyJsonButton');
                let currentIndex = -1;
        
                function showJsonDetails(index) {
                    currentIndex = index;
                    const jsonData = requests_data[rows[currentIndex].dataset.originalIndex];
                    jsonDetailsContent.innerHTML = '';
                    jsonDetailsContent.appendChild(renderjson(jsonData));
                    jsonDetailsModal.show();
                }
        
                rows.forEach((row, index) => {
                    row.dataset.originalIndex = index;
                    row.addEventListener('click', () => {
                        showJsonDetails(rows.indexOf(row));
                    });
                });
        
                copyJsonButton.addEventListener('click', () => {
                    if (currentIndex !== -1) {
                        const jsonData = requests_data[rows[currentIndex].dataset.originalIndex];
                        navigator.clipboard.writeText(JSON.stringify(jsonData, null, 2)).then(() => {
                            alert('JSON copied to clipboard!');
                        }).catch(err => {
                            console.error('Failed to copy JSON: ', err);
                        });
                    }
                });
        
                document.addEventListener('keydown', (event) => {
                    if (jsonDetailsModal._isShown) {
                        if (event.key === 'ArrowDown') {
                            if (currentIndex < rows.length - 1) {
                                showJsonDetails(currentIndex + 1);
                            }
                        } else if (event.key === 'ArrowUp') {
                                        if (currentIndex > 0) {
                                            showJsonDetails(currentIndex - 1);
                                        }
                                    }
                                }
                            });
                            
                            urlFilterInput.addEventListener('input', () => {
                                const filterText = urlFilterInput.value.toLowerCase();
                                rows.forEach(row => {
                                    const url = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                                    if (url.includes(filterText)) {
                                        row.style.display = '';
                                    } else {
                                        row.style.display = 'none';
                                    }
                                });
                            });        
                headers.forEach(header => {
                    header.addEventListener('click', () => {
                        const sortKey = header.dataset.sort;
                        const isAsc = header.classList.contains('asc');
                        const direction = isAsc ? 'desc' : 'asc';
        
                        headers.forEach(h => h.classList.remove('asc', 'desc'));
                        header.classList.add(direction);
        
                        rows.sort((a, b) => {
                            const aVal = a.querySelector(`td:nth-child(${getColumnIndex(sortKey)})`).textContent;
                            const bVal = b.querySelector(`td:nth-child(${getColumnIndex(sortKey)})`).textContent;
        
                            if (sortKey === 'timestamp') {
                                return direction === 'asc' ? new Date(aVal) - new Date(bVal) : new Date(bVal) - new Date(aVal);
                            }
        
                            return direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                        });
        
                        tbody.innerHTML = '';
                        rows.forEach(row => tbody.appendChild(row));
                    });
                });
        
                function getColumnIndex(key) {
                    if (key === 'url') return 2;
                    if (key === 'timestamp') return 5;
                    return 1;
                }
            deleteAllButton.addEventListener('click', () => {
                if (confirm('Are you sure you want to delete all requests?')) {
                    fetch('/api/requests/delete_all', { method: 'POST' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                location.reload();
                            } else {
                                alert('Failed to delete requests.');
                            }
                        });
                }
            });
            });
        </script></body>
</html>
