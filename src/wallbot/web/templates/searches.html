<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Endpoint Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-size: 0.75rem;
        }
        h1, .h1 {
            font-size: 1.5rem;
        }
        .form-control {
            font-size: 0.75rem;
            padding: 0.2rem 0.4rem;
        }
        .btn {
            font-size: 0.75rem;
            padding: 0.2rem 0.4rem;
        }
        .container {
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .mt-4 {
            margin-top: 1.5rem !important;
        }
        .json-key {
            color: #007bff;
            font-weight: bold;
        }
        .json-string {
            color: #28a745;
        }
        .json-number {
            color: #dc3545;
        }
        .json-boolean {
            color: #ffc107;
        }
        .json-null {
            color: #6c757d;
        }
        .json-object > .json-content, .json-array > .json-content {
            margin-left: 15px;
            border-left: 1px dotted #ccc;
            padding-left: 5px;
        }
        .json-toggle {
            cursor: pointer;
            user-select: none;
        }
        .json-collapsed > .json-content {
            display: none;
        }
        .json-collapsed > .json-toggle::before {
            content: "+ ";
        }
        .json-expanded > .json-toggle::before {
            content: "- ";
        }
        .response-container {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 1rem;
            border-radius: 0.25rem;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Wallbot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/searches">API Tester</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/manual-search">Manual Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/saved_searches">Saved Searches</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/saved_items_list">Saved Items</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="fetch('/restart', { method: 'POST' })">Restart</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>API Endpoint Tester</h1>

        <div class="input-group mb-3">
            <select class="form-select" id="requestMethod" style="max-width: 120px;">
                <option value="GET" selected>GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
            </select>
            <input type="text" id="requestUrl" class="form-control" placeholder="Enter API URL" aria-label="API URL" aria-describedby="sendButton">
            <button class="btn btn-primary" type="button" id="sendButton">Send Request</button>
        </div>

        <div class="mb-3">
            <label for="customHeaders" class="form-label">Custom Headers (JSON)</label>
            <textarea class="form-control" id="customHeaders" rows="3" placeholder='{"custom_headers": [{"headerName": "X-My-Header", "value": "some-value"}]}'></textarea>
        </div>
        <div class="mb-3" id="requestBodyContainer" style="display: none;">
            <label for="requestBody" class="form-label">Request Body (JSON)</label>
            <textarea class="form-control" id="requestBody" rows="5"></textarea>
        </div>

        <div class="mb-3">
            <strong>Status Code:</strong> <span id="statusCode">N/A</span>
        </div>

        <div id="responseActions" class="mb-2" style="display: none;">
            <button class="btn btn-secondary btn-sm" id="copyJsonButton">Copy JSON</button>
        </div>

        <div class="response-container" id="responseContainer">
            <!-- API response will be displayed here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const requestMethodSelect = document.getElementById('requestMethod');
            const requestUrlInput = document.getElementById('requestUrl');
            const requestBodyContainer = document.getElementById('requestBodyContainer');
            const requestBodyTextarea = document.getElementById('requestBody');
            const customHeadersTextarea = document.getElementById('customHeaders');
            const sendButton = document.getElementById('sendButton');
            const statusCodeSpan = document.getElementById('statusCode');
            const responseContainer = document.getElementById('responseContainer');
            const responseActions = document.getElementById('responseActions');
            const copyJsonButton = document.getElementById('copyJsonButton');

            // Toggle request body visibility based on method
            requestMethodSelect.addEventListener('change', function() {
                const selectedMethod = this.value;
                if (selectedMethod === 'POST' || selectedMethod === 'PUT') {
                    requestBodyContainer.style.display = 'block';
                } else {
                    requestBodyContainer.style.display = 'none';
                }
            });

            sendButton.addEventListener('click', async function () {
                const url = requestUrlInput.value.trim();
                const method = requestMethodSelect.value;
                const body = requestBodyTextarea.value.trim();
                const headersValue = customHeadersTextarea.value.trim();

                if (!url) {
                    alert('Please enter a URL.');
                    return;
                }

                // Clear previous response
                statusCodeSpan.textContent = 'N/A';
                responseContainer.innerHTML = '<div class="text-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>';
                responseActions.style.display = 'none';

                let requestPayload = {
                    url: url,
                    method: method,
                };

                if (headersValue) {
                    try {
                        const headersData = JSON.parse(headersValue);
                        if (headersData.custom_headers && Array.isArray(headersData.custom_headers)) {
                            requestPayload.headers = headersData.custom_headers.reduce((acc, header) => {
                                if (header.headerName && header.value) {
                                    acc[header.headerName] = header.value;
                                }
                                return acc;
                            }, {});
                        } else if (Object.keys(headersData).length > 0 && !headersData.custom_headers) {
                            // allow pasting a simple json object of headers
                             requestPayload.headers = headersData;
                        }
                    } catch (e) {
                        alert('Custom headers is not a valid JSON.');
                        return;
                    }
                }

                if ((method === 'POST' || method === 'PUT') && body) {
                    try {
                        // Try to parse as JSON
                        requestPayload.json = JSON.parse(body);
                    } catch (e) {
                        // If not valid JSON, send as plain data
                        requestPayload.data = body;
                    }
                }

                try {
                    const response = await fetch('/api/request', {
                        method: 'POST', // Always POST to our /api/request endpoint
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestPayload),
                    });

                    const data = await response.json();

                    statusCodeSpan.textContent = data.status_code;
                    responseContainer.innerHTML = ''; // Clear spinner

                    if (data.is_json) {
                        responseContainer.appendChild(renderJson(data.content));
                        responseActions.style.display = 'block';

                        copyJsonButton.onclick = function() {
                            navigator.clipboard.writeText(JSON.stringify(data.content, null, 2))
                                .then(() => {
                                    const originalText = copyJsonButton.textContent;
                                    copyJsonButton.textContent = 'Copied!';
                                    setTimeout(() => {
                                        copyJsonButton.textContent = originalText;
                                    }, 2000);
                                })
                                .catch(err => {
                                    console.error('Could not copy text: ', err);
                                    alert('Failed to copy JSON.');
                                });
                        };
                    } else {
                        responseContainer.textContent = data.content;
                    }

                } catch (error) {
                    statusCodeSpan.textContent = 'Error';
                    responseContainer.textContent = 'An error occurred: ' + error.message;
                    console.error('Error:', error);
                }
            });

            function renderJson(jsonObj) {
                const container = document.createElement('div');
                container.className = 'json-container';
                container.appendChild(createJsonElement(jsonObj, true)); // Start collapsed

                return container;
            }

            function createJsonElement(data, isCollapsed) {
                const element = document.createElement('div');

                if (Array.isArray(data)) {
                    element.className = 'json-array ' + (isCollapsed ? 'json-collapsed' : 'json-expanded');
                    const toggle = document.createElement('span');
                    toggle.className = 'json-toggle';
                    toggle.textContent = '[' + data.length + ']';
                    element.appendChild(toggle);

                    const content = document.createElement('div');
                    content.className = 'json-content';
                    data.forEach((item, index) => {
                        const itemElement = document.createElement('div');
                        itemElement.innerHTML = `<span class="json-key">${index}:</span> `;
                        itemElement.appendChild(createJsonElement(item, true));
                        content.appendChild(itemElement);
                    });
                    element.appendChild(content);

                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        element.classList.toggle('json-collapsed');
                        element.classList.toggle('json-expanded');
                    });

                } else if (typeof data === 'object' && data !== null) {
                    element.className = 'json-object ' + (isCollapsed ? 'json-collapsed' : 'json-expanded');
                    const toggle = document.createElement('span');
                    toggle.className = 'json-toggle';
                    toggle.textContent = '{' + Object.keys(data).length + '}';
                    element.appendChild(toggle);

                    const content = document.createElement('div');
                    content.className = 'json-content';
                    for (const key in data) {
                        if (Object.hasOwnProperty.call(data, key)) {
                            const keyElement = document.createElement('span');
                            keyElement.className = 'json-key';
                            keyElement.textContent = `"${key}": `;
                            
                            const valueElement = document.createElement('span');
                            valueElement.appendChild(createJsonElement(data[key], true));
                            
                            const line = document.createElement('div');
                            line.appendChild(keyElement);
                            line.appendChild(valueElement);
                            content.appendChild(line);
                        }
                    }
                    element.appendChild(content);

                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        element.classList.toggle('json-collapsed');
                        element.classList.toggle('json-expanded');
                    });

                } else {
                    const span = document.createElement('span');
                    if (typeof data === 'string') {
                        span.className = 'json-string';
                        span.textContent = `"${data}"`;
                    } else if (typeof data === 'number') {
                        span.className = 'json-number';
                        span.textContent = data;
                    } else if (typeof data === 'boolean') {
                        span.className = 'json-boolean';
                        span.textContent = data;
                    } else if (data === null) {
                        span.className = 'json-null';
                        span.textContent = 'null';
                    }
                    element.appendChild(span);
                }
                return element;
            }
        });
    </script>
</body>
</html>
